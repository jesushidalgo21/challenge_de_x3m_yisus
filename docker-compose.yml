services:
  postgres:
    image: postgres:15.6-alpine
    container_name: x3m_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_META_DB: ${AIRFLOW_META_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - x3m_net

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x3m_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_common_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_META_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_TARGET_DB: ${POSTGRES_DB}
      DBT_PG_HOST: postgres
      DBT_PG_PORT: 5432
      DBT_PG_USER: ${POSTGRES_USER}
      DBT_PG_PASSWORD: ${POSTGRES_PASSWORD}
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@example.com
    networks:
      - x3m_net

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x3m_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_common_env
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ./tests:/opt/airflow/tests
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - x3m_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x3m_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_common_env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ./tests:/opt/airflow/tests
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - x3m_net

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: x3m_streamlit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app
    networks:
      - x3m_net

volumes:
  postgres_data:
  airflow_logs:

networks:
  x3m_net:
    driver: bridge
