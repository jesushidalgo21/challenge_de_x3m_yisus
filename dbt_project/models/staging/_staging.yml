version: 2

models:
  - name: stg_products
    description: "One row per (date, product_id): flattened and typed product catalog snapshot."
    columns:
      - name: date
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: product_title
        tests:
          - not_null
      - name: price
        tests:
          - non_negative

  - name: stg_cart_items
    description: "One row per (date, cart_id, product_id): flattened and typed cart line items."
    columns:
      - name: date
        tests:
          - not_null
      - name: cart_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests:
          - positive
      - name: discounted_total
        tests:
          - non_negative
