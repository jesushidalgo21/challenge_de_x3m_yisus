version: 2

models:
  - name: product_daily_revenue
    description: "Revenue and units sold per product per day. `date` is Airflow's logical execution date, not sourced from the API."
    columns:
      - name: product_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: units_sold
        tests:
          - positive
      - name: revenue
        tests:
          - non_negative
